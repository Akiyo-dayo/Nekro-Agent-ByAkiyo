# NekroAgent 开发环境 Docker Compose
# 用于启动开发所需的依赖服务，主应用通过源码运行
#
# 使用方法:
# docker compose -f docker/docker-compose.dev.yml up -d
#
# 本文件**没有 NA 服务**（主应用走源码），因此不涉及 NEKRO_SELF_HOSTNAME（#47）：
# 每份定义 `nekro_agent` 服务的 compose 都要把它传进容器，见
# tests/test_compose_self_hostname.py —— 这里的「没有」是被那条用例登记、断言过的豁免。

services:
  # PostgreSQL 服务
  nekro_postgres:
    image: postgres:16
    container_name: nekro_dev_postgres
    environment:
      POSTGRES_USER: nekro_agent
      POSTGRES_PASSWORD: nekro_agent
      POSTGRES_DB: nekro_agent_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"  # 使用 5433 避免与本地 PostgreSQL 冲突
    volumes:
      - ../data/dev_postgres_data:/var/lib/postgresql/data:z
    networks:
      - nekro_network
    restart: unless-stopped

  # Qdrant 服务
  nekro_qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: nekro_dev_qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=your-qdrant-api-key
    ports:
      - "6334:6333" # 使用 6334 避免与生产环境 Qdrant 冲突
    volumes:
      - ../data/dev_qdrant_data:/qdrant/storage:z
    networks:
      - nekro_network
    restart: unless-stopped

  # Napcat 服务
  nekro_napcat:
    image: mlikiowa/napcat-docker
    container_name: nekro_dev_napcat
    ports:
      - "6199:6099" # 使用 6199 避免与默认 6099 冲突
    volumes:
      # 只挂 uploads、只读（NA 交给 NapCat 发送的文件都在那里），见 docker-compose-x-napcat.yml。
      # 第一次起之前先建好这个目录（在仓库根目录 `mkdir -p data/nekro_agent/uploads`）：目录不在时
      # Docker 会以 root 身份替你建，宿主上跑的开发版 NA 就写不进去了
      - ../data/nekro_agent/uploads:/app/nekro_agent_data/uploads:ro
      - ../data/nekro_agent/napcat_data/QQ:/app/.config/QQ
      - ../data/nekro_agent/napcat_data/napcat:/app/napcat/config
    networks:
      - nekro_network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  nekro_network:
    name: nekro_dev_network
    driver: bridge
